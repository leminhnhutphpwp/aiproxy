<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIProxy — Dashboard</title>
<link rel="icon" href="/favicon.svg">
<script src="/dashboard/js/theme.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = window.aiproxyTheme;</script>
<link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.css" rel="stylesheet" type="text/css" />
<link rel="stylesheet" href="/dashboard/css/style.css">
</head>
<body class="min-h-screen bg-base-100 flex items-center justify-center p-4" data-theme="aiproxy">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 mb-4">
        <svg viewBox="0 0 100 100" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="logoG" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FF6B00"/>
              <stop offset="100%" stop-color="#FFB800"/>
            </linearGradient>
          </defs>
          <path d="M20 50 H80 M62 32 L80 50 L62 68" fill="none" stroke="url(#logoG)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-base-content">AIProxy Dashboard</h1>
    </div>
    <div class="card bg-base-200 shadow-xl border border-base-300">
      <div class="card-body">
        <form id="loginForm" onsubmit="return handleLogin(event)">
          <div class="form-control mb-4">
            <label class="label" for="username">
              <span class="label-text text-base-content/80">Tên đăng nhập</span>
            </label>
            <input type="text" id="username" name="username" required autocomplete="username"
              class="input input-bordered w-full bg-base-100" placeholder="Nhập tên đăng nhập">
          </div>
          <div class="form-control mb-6">
            <label class="label" for="password">
              <span class="label-text text-base-content/80">Mật khẩu</span>
            </label>
            <input type="password" id="password" name="password" required autocomplete="current-password"
              class="input input-bordered w-full bg-base-100" placeholder="Nhập mật khẩu">
          </div>
          <div class="form-control mb-4">
            <label class="label cursor-pointer justify-start gap-2">
              <input type="checkbox" id="remember" class="checkbox checkbox-sm checkbox-warning" checked>
              <span class="label-text text-base-content/80">Ghi nhớ đăng nhập</span>
            </label>
          </div>
          <div id="loginError" class="hidden mb-4 p-3 rounded-xl bg-error/10 border border-error/30 text-error text-sm"></div>
          <button type="submit" id="loginBtn"
            class="btn w-full bg-gradient-to-r from-[#FF6B00] to-[#FFB800] border-none text-white hover:from-[#FF5500] hover:to-[#FFA500] shadow-lg shadow-[#FF6B00]/20">
            Đăng nhập
          </button>
        </form>
      </div>
    </div>
  </div>
<script src="/dashboard/js/utils.js"></script>
<script>
async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  btn.disabled = true;
  btn.textContent = 'Đang đăng nhập...';
  err.classList.add('hidden');
  try {
    const res = await fetch('/dashboard/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        remember: document.getElementById('remember').checked,
      }),
    });
    const data = await res.json();
    if (res.ok) {
      window.location.href = '/dashboard';
    } else {
      err.textContent = data.error || 'Sai tên đăng nhập hoặc mật khẩu';
      err.classList.remove('hidden');
    }
  } catch {
    err.textContent = 'Lỗi kết nối đến server';
    err.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Đăng nhập';
  }
}
</script>
</body>
</html>
